name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build-windows:
    name: Build unsigned Windows artifacts
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.release.outputs.version }}
      artifact-name: ${{ steps.release.outputs.artifact-name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve Yarn cache folder
        id: yarn-cache
        shell: pwsh
        run: echo "dir=$(yarn config get cacheFolder)" >> "$env:GITHUB_OUTPUT"

      - name: Restore Yarn cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Run Windows package gate
        run: corepack yarn workspace dsh-plugin-desktop check:win-package

      - name: Build Windows installer
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: corepack yarn dist:win

      - name: Build Windows portable archive
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: corepack yarn dist:win-portable

      - name: Verify release identity and artifacts
        id: release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = Get-Content -Raw package.json | ConvertFrom-Json
          $desktop = Get-Content -Raw dsh-plugin-desktop/package.json | ConvertFrom-Json
          if ($workspace.version -ne $desktop.version) {
            throw "Version mismatch: workspace=$($workspace.version), desktop=$($desktop.version)"
          }

          $version = $workspace.version
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") {
            throw "Release tag ${{ github.ref_name }} must equal v$version"
          }

          $dist = 'dsh-plugin-desktop/dist'
          $installer = "$dist/DSH-Desktop-$version-x64-Setup.exe"
          $portable = "$dist/DSH-Desktop-$version-x64-Portable.zip"
          foreach ($path in @($installer, $portable)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing release artifact: $path"
            }
          }

          Get-FileHash -Algorithm SHA256 -LiteralPath $installer, $portable |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path -Leaf $_.Path)" } |
            Set-Content -Encoding utf8 "$dist/SHA256SUMS.txt"

          echo "version=$version" >> "$env:GITHUB_OUTPUT"
          echo "artifact-name=dsh-desktop-windows-$version" >> "$env:GITHUB_OUTPUT"

      - name: Upload validated Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release.outputs.artifact-name }}
          path: |
            dsh-plugin-desktop/dist/DSH-Desktop-${{ steps.release.outputs.version }}-x64-Setup.exe
            dsh-plugin-desktop/dist/DSH-Desktop-${{ steps.release.outputs.version }}-x64-Portable.zip
            dsh-plugin-desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: build-windows
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-windows.outputs.artifact-name }}
          path: release

      - name: Publish release from the existing version tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build-windows.outputs.version }}
        run: |
          set -euo pipefail
          release_args=(
            --verify-tag
            --generate-notes
            --title "DSH Desktop $RELEASE_TAG"
          )
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release/* "${{release_args[@]}}"
